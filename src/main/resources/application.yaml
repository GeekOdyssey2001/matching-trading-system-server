
server:
  port: 8090

spring:
  application:
    name: matching-trading-system-server
  datasource:
    url:  jdbc:sqlite:/Users/zhangjiaqi/develop/data/sqlite-data/utmc_store.sqlite
    driver-class-name: org.sqlite.JDBC
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 6000ms


mybatis:
  mapperLocations: classpath:mapper/*.xml
mybatis-plus:
  configuration:
    jdbc-type-for-null: 'null'

#缓存过期时间(时间都是秒)
cache-expire:
  captcha: 100  #验证码更新时间
  account: 3600 #账号有效时间
  order: 36000 #委托数据有效期

#机器位置（为后面生成全局唯一数做做准备）
counter:
  dataCenterId: 0 #机房ID
  workerId: 0 #机柜ID
